<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d62d9"/>
      <stop offset="100%" stop-color="#072b5c"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
  </defs>
  <!-- Fondo distintivo de marca -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- Ondas concéntricas de emisión en directo -->
  <path d="M 44 19 A 19 19 0 0 1 44 45" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 38 24 A 12 12 0 0 1 38 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.95"/>
  <path d="M 32 29 A 5 5 0 0 1 32 35" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Silueta autóctona del pez de la ciénaga -->
